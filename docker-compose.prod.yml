services:
  web:
    image: registry.kssoft.com.pl:30358/child-learning:latest
    container_name: child-learning
    ports:
      - "${HTTP_PORT:-3002}:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
